<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill – Toy Kingdom</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://toykingdomonline.com/wp-content/uploads/2025/04/toykingdomlogo.png">
<link rel="stylesheet" href="assets/invoice.css?v=20261121p">
<style>
  /* page chrome only; the bill and label styles are in assets/invoice.css */
  body { margin:0; background:#e9e7ef; color:#111; font:12px/1.45 Arial, Helvetica, sans-serif; }
  .toolbar { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; padding:12px; background:#fff; border-bottom:1px solid #ddd; }
  .toolbar button, .toolbar a { font:600 14px Arial, sans-serif; padding:10px 16px; border-radius:999px; border:1.5px solid #8649FB; background:#8649FB; color:#fff; cursor:pointer; text-decoration:none; }
  .toolbar .ghost { background:#fff; color:#8649FB; }
  .toolbar .hint { width:100%; text-align:center; color:#555; font-size:12px; }
  .page-title { width:210mm; margin:18px auto 6px; font:700 14px Arial; color:#333; }
  .tkdoc .docsheet { margin:0 auto 18px; box-shadow:0 4px 24px rgba(0,0,0,.12); }
  .err { color:#b00020; font-size:15px; }

  @page { size:A4; margin:0; }
  @media print {
    body { background:#fff; }
    .toolbar, .page-title { display:none; }
    .tkdoc .docsheet { margin:0; box-shadow:none; width:210mm; }
    body[data-print="label"] #invoiceSheet, body[data-print="label"] .t-inv { display:none; }
    body[data-print="invoice"] #labelSheet, body[data-print="invoice"] .t-lbl { display:none; }
    #labelSheet { width:210mm; height:297mm; overflow:hidden; break-after:avoid; }
    body[data-print="label"] #labelSheet { break-after:auto; }
  }
  @media screen and (max-width:820px) {
    .page-title { width:auto; margin:14px 8px 6px; }
    .tkdoc .docsheet { width:auto; min-height:0; margin:0 8px 14px; padding:12px; }
    .tkdoc .label-sheet { width:210mm; height:297mm; margin:0 auto 14px; padding:0; zoom:.44; }
    .tkdoc .inv-parties { grid-template-columns:1fr; } .tkdoc .r-al { text-align:left; } .tkdoc .watermark { font-size:60px; }
  }
</style>
</head>
<body data-page="invoice" data-print="invoice">
<div class="toolbar" id="tools"></div>
<div id="out" class="tkdoc"><p class="docsheet">Loading bill…</p></div>
<script src="assets/products.js?v=20261121p"></script>
<script src="assets/firebase-config.js?v=20261121p"></script>
<script src="assets/store.js?v=20261121p"></script>
<script src="assets/invoice.js?v=20261121p"></script>
<script type="module" src="assets/fb.js?v=20261121p"></script>
</body>
</html>
