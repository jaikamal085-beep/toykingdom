<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill – Toy Kingdom</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://toykingdomonline.com/wp-content/uploads/2025/04/toykingdomlogo.png">
<style>
  :root { --ink:#111; --muted:#555; --line:#222; --soft:#bbb; --brand:#8649FB; }
  * { box-sizing:border-box; }
  body { margin:0; background:#e9e7ef; color:var(--ink); font:12px/1.45 Arial, Helvetica, sans-serif; }
  .toolbar { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; padding:12px; background:#fff; border-bottom:1px solid #ddd; }
  .toolbar button, .toolbar a { font:600 14px Arial, sans-serif; padding:10px 16px; border-radius:999px; border:1.5px solid var(--brand); background:var(--brand); color:#fff; cursor:pointer; text-decoration:none; }
  .toolbar .ghost { background:#fff; color:var(--brand); }
  .toolbar .hint { width:100%; text-align:center; color:var(--muted); font-size:12px; }
  .page-title { width:210mm; margin:18px auto 6px; font:700 14px Arial; color:#333; }
  .sheet { position:relative; width:210mm; min-height:297mm; margin:0 auto 18px; padding:10mm; background:#fff; box-shadow:0 4px 24px rgba(0,0,0,.12); overflow:hidden; }
  .err { color:#b00020; font-size:15px; }
  .k { color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
  .watermark { position:absolute; inset:0; display:grid; place-items:center; font:900 110px Arial; color:rgba(200,0,0,.07); transform:rotate(-28deg); pointer-events:none; z-index:0; }

  /* ---- shipping label: exactly 1/4 of A4 (A6 portrait, 105 x 148.5 mm), admin only ---- */
  .label-sheet { min-height:0; padding:0; }
  .label { position:relative; width:105mm; height:148.5mm; padding:4mm; border-right:1px dashed #999; border-bottom:1px dashed #999; display:flex; flex-direction:column; gap:2mm; overflow:hidden; }
  .label .box { border:1.5px solid var(--line); }
  .lb-head { display:flex; align-items:center; gap:3mm; padding:2mm 2.5mm; }
  .lb-head .logo { height:10mm; width:auto; }
  .lb-head .ord { flex:1; line-height:1.25; }
  .lb-head .ord b { font-size:12.5px; display:block; letter-spacing:.02em; }
  .lb-head .ord span { font-size:9px; color:var(--muted); }
  .pay { padding:1.6mm 2mm; text-align:center; line-height:1.15; }
  .pay.cod { background:#111; color:#fff; }
  .pay .t { font-size:8.5px; font-weight:700; letter-spacing:.08em; }
  .pay .v { font:800 13px Arial; }
  /* receiver and sender: identical blocks, equal height, no empty space */
  .party { flex:1 1 0; min-height:0; padding:2mm 3mm; display:flex; flex-direction:column; justify-content:space-evenly; overflow:hidden; }
  .party .k { font-size:8.5px; }
  .party .nm { font:800 15px Arial; line-height:1.2; }
  .party .ad { font-size:12px; line-height:1.35; }
  .party .pin { font:900 19px Arial; letter-spacing:.05em; line-height:1.1; }
  .party .ph { font:700 12px Arial; }
  .bc { text-align:center; padding-top:1mm; }
  .barcode { width:92%; height:13mm; display:block; margin:0 auto; fill:#000; }
  .bc-text { font:700 10px monospace; letter-spacing:.2em; }
  .cut-hint { position:absolute; left:110mm; top:6mm; width:88mm; color:#888; font-size:11px; line-height:1.5; }

  /* ---- tax invoice ---- */
  .invoice { position:relative; }
  .inv-head { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--soft); padding-bottom:6px; }
  .inv-head .logo { height:42px; width:auto; }
  .inv-title { text-align:right; display:grid; font-size:13px; }
  .inv-title span { font-size:11px; color:var(--muted); }
  .inv-parties { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:8px 0; border-bottom:1px solid var(--soft); }
  .r-al { text-align:right; }
  .inv-table { width:100%; border-collapse:collapse; margin-top:8px; font-size:11px; }
  .inv-table th, .inv-table td { border:1px solid var(--line); padding:4px 5px; vertical-align:top; }
  .inv-table th { background:#eee; font-size:10.5px; }
  .inv-table .c { text-align:center; } .inv-table .r { text-align:right; white-space:nowrap; }
  .inv-table .sub { color:var(--muted); font-size:10px; }
  .inv-pay { display:flex; justify-content:space-between; gap:14px; margin-top:8px; align-items:flex-end; }
  .sign { text-align:right; } .sign-space { height:28px; }
  .fine { color:var(--muted); font-size:10px; margin-top:8px; }

  @page { size:A4; margin:0; }
  @media print {
    body { background:#fff; }
    .toolbar, .page-title, .cut-hint { display:none; }
    .sheet { margin:0; box-shadow:none; width:210mm; }
    body[data-print="label"] #invoiceSheet, body[data-print="label"] .t-inv { display:none; }
    body[data-print="invoice"] #labelSheet, body[data-print="invoice"] .t-lbl { display:none; }
    #labelSheet { min-height:297mm; }
  }
  @media (max-width:820px) {
    .page-title { width:auto; margin:14px 8px 6px; }
    .sheet { width:auto; min-height:0; margin:0 8px 14px; padding:12px; }
    .label-sheet { padding:0; overflow-x:auto; }
    .inv-parties { grid-template-columns:1fr; } .r-al { text-align:left; } .watermark { font-size:60px; }
    .cut-hint { display:none; }
  }
</style>
</head>
<body data-print="invoice">
<div class="toolbar" id="tools"></div>
<div id="out"><p class="sheet">Loading bill…</p></div>
<script src="assets/products.js?v=20261121k"></script>
<script src="assets/firebase-config.js?v=20261121k"></script>
<script src="assets/store.js?v=20261121k"></script>
<script src="assets/invoice.js?v=20261121k"></script>
<script type="module" src="assets/fb.js?v=20261121k"></script>
</body>
</html>
